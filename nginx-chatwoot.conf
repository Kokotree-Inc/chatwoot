# ============================================================================
# CHATWOOT NGINX CONFIGURATION FILE
# ============================================================================
# Domain: chat.apaya.com
# Backend: Chatwoot Rails running in Docker on port 3080
#
# ============================================================================
# HOW TO USE THIS FILE
# ============================================================================
#
# Step 1: Copy this file to nginx sites-available directory
#   sudo cp nginx-chatwoot.conf /etc/nginx/sites-available/chatwoot
#
# Step 2: Edit the file (if needed - domain is already set to chat.apaya.com)
#   sudo nano /etc/nginx/sites-available/chatwoot
#   # Or use: sudo vi /etc/nginx/sites-available/chatwoot
#
# Step 3: Test the configuration for syntax errors
#   sudo nginx -t
#   # Expected output: "nginx: configuration file ... test is successful"
#
# Step 4: Enable the site by creating a symlink
#   sudo ln -s /etc/nginx/sites-available/chatwoot /etc/nginx/sites-enabled/
#
# Step 5: Reload nginx to apply changes
#   sudo systemctl reload nginx
#   # Or restart: sudo systemctl restart nginx
#
# Step 6: Install SSL certificate (after DNS is configured)
#   sudo certbot --nginx -d chat.apaya.com
#   # Certbot will automatically configure SSL and update this file
#
# Step 7: Verify it's working
#   curl -I http://chat.apaya.com        # Test HTTP (before SSL)
#   curl -I https://chat.apaya.com       # Test HTTPS (after SSL)
#
# ============================================================================
# TROUBLESHOOTING
# ============================================================================
#
# Check nginx status:
#   sudo systemctl status nginx
#
# View nginx error logs:
#   sudo tail -f /var/log/nginx/chatwoot_error_443.log
#
# Test configuration:
#   sudo nginx -t
#
# Reload nginx after changes:
#   sudo nginx -t && sudo systemctl reload nginx
#
# ============================================================================

# ============================================================================
# UPSTREAM BACKEND CONFIGURATION
# ============================================================================
# This defines a group of backend servers that Nginx will proxy requests to.
# In our case, we have one Chatwoot Rails server running in Docker.
#
# What is upstream?
# - Upstream is Nginx's way of defining backend servers
# - It allows Nginx to load balance between multiple servers (if you had more)
# - All requests matching certain locations will be forwarded to these servers
#
# ============================================================================
upstream chatwoot_backend {
    # ------------------------------------------------------------------------
    # zone upstreams 64K;
    # ------------------------------------------------------------------------
    # Creates a shared memory zone for storing upstream configuration
    # - Name: "upstreams"
    # - Size: 64K (64 kilobytes)
    # - Purpose: Allows sharing upstream state across worker processes
    # - Why needed: Required for dynamic upstream configuration and health checks
    # - This is a small memory allocation for tracking backend server status
    #
    zone upstreams 64K;
    
    # ------------------------------------------------------------------------
    # server 127.0.0.1:3080;
    # ------------------------------------------------------------------------
    # Defines the backend server address and port
    # - 127.0.0.1 = localhost (only accessible from this server, not from internet)
    # - 3080 = Port where Chatwoot Rails is running (mapped from Docker container port 3000)
    # - Why localhost? Security - Chatwoot is only accessible from this server
    # - Why 3080? Changed from 3000 to avoid conflicts with other services
    # - Docker mapping: Container port 3000 → Host port 3080
    #
    # If you had multiple Chatwoot instances for load balancing, you'd add more:
    #   server 127.0.0.1:3080;
    #   server 127.0.0.1:3081;
    #   server 127.0.0.1:3082;
    #
    server 127.0.0.1:3080;
    
    # ------------------------------------------------------------------------
    # keepalive 32;
    # ------------------------------------------------------------------------
    # Number of idle keepalive connections to maintain to the backend
    # - 32 = Keep 32 connections open and ready for reuse
    # - Purpose: Improves performance by reusing connections instead of creating new ones
    # - How it works: After a request, connection stays open for reuse (up to 32)
    # - Benefits: Faster response times, less overhead from connection setup
    # - Without this: Each request creates a new connection (slower)
    # - With this: Reuses existing connections (faster)
    #
    # Example flow:
    #   1. First request → Creates connection → Sends request → Gets response → Keeps connection open
    #   2. Second request → Reuses same connection → Sends request → Gets response → Keeps connection open
    #   3. ... up to 32 concurrent connections
    #
    keepalive 32;
}

# ============================================================================
# WEBSOCKET UPGRADE MAPPING (for ActionCable)
# ============================================================================
# This maps HTTP upgrade headers to connection upgrade headers for WebSocket support
# Chatwoot uses WebSockets for real-time features like ActionCable (live chat updates)
#
# What is this for?
# - WebSockets allow real-time bidirectional communication (like live chat)
# - Regular HTTP requests are one-way (request → response)
# - WebSockets stay open for continuous communication
# - ActionCable is Rails' WebSocket framework used by Chatwoot
#
# How it works:
# - When a client wants to upgrade to WebSocket, it sends "Upgrade: websocket" header
# - This map checks if upgrade header exists and sets connection header accordingly
# - If upgrade header exists → Set connection to "upgrade" (enable WebSocket)
# - If no upgrade header → Set connection to "close" (regular HTTP request)
#
# ============================================================================
map $http_upgrade $connection_upgrade {
    # ------------------------------------------------------------------------
    # default upgrade;
    # ------------------------------------------------------------------------
    # Default behavior: If $http_upgrade header exists (any value), use "upgrade"
    # - $http_upgrade = HTTP "Upgrade" header from client request
    # - "upgrade" = Value to set for Connection header when upgrade is requested
    # - This enables WebSocket connections when client requests it
    #
    default upgrade;
    
    # ------------------------------------------------------------------------
    # '' close;
    # ------------------------------------------------------------------------
    # If $http_upgrade is empty (no upgrade header), set connection to "close"
    # - '' = Empty string (no upgrade header present)
    # - "close" = Value to set for Connection header (normal HTTP, no WebSocket)
    # - This handles regular HTTP requests that don't need WebSocket
    #
    '' close;
}

# HTTP Server - Redirects to HTTPS (after certbot setup)
# Before certbot, comment out the return line to allow HTTP access
server {
    listen 80;
    listen [::]:80;
    # Domain: chat.apaya.com
    server_name chat.apaya.com;

    access_log /var/log/nginx/chatwoot_access_80.log;
    error_log /var/log/nginx/chatwoot_error_80.log;

    # Redirect to HTTPS (uncomment after certbot setup)
    # return 301 https://$server_name$request_uri;

    # Temporary: Allow HTTP access before SSL setup
    # Remove this location block after certbot setup
    location / {
        proxy_pass http://chatwoot_backend;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        client_max_body_size 100M;
        proxy_read_timeout 36000s;
        proxy_connect_timeout 60s;
    }
}

# HTTPS Server - Main configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # Domain: chat.apaya.com
    server_name chat.apaya.com;

    # SSL Configuration (will be managed by certbot)
    # Uncomment these lines after running certbot
    # SSL certificates (will be managed by certbot)
    # After running certbot, these will be automatically configured:
    # ssl_certificate /etc/letsencrypt/live/chat.apaya.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/chat.apaya.com/privkey.pem;
    
    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # Optional: Generate DH parameters for better security
    # Run: sudo openssl dhparam -out /etc/ssl/dhparam.pem 2048
    # Then uncomment: ssl_dhparam /etc/ssl/dhparam.pem;

    # Logging
    access_log /var/log/nginx/chatwoot_access_443.log;
    error_log /var/log/nginx/chatwoot_error_443.log;

    # Allow underscores in headers (required for some APIs)
    underscores_in_headers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Main location - Proxy to Chatwoot
    location / {
        proxy_pass http://chatwoot_backend;
        proxy_redirect off;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support for ActionCable
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts and limits
        proxy_read_timeout 36000s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 36000s;
        client_max_body_size 100M;
        client_body_buffer_size 128k;
        proxy_buffering off;
    }

    # Static assets caching (SDK, images, etc.)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://chatwoot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ActionCable WebSocket endpoint
    location /cable {
        proxy_pass http://chatwoot_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check endpoint (if available)
    location /health {
        proxy_pass http://chatwoot_backend;
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

